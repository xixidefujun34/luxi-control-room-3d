<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集控室 - 3D效果图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;font-family:'Microsoft YaHei',sans-serif;overflow:hidden}
#c{width:100vw;height:100vh;display:block}
#ui{
  position:fixed;top:20px;left:20px;background:rgba(0,0,0,0.82);color:#fff;
  padding:15px 18px;border-radius:12px;z-index:10;font-size:13px;
  backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12);max-width:240px;
  user-select:none;
}
#ui h2{font-size:16px;margin-bottom:10px;color:#4fc3f7;letter-spacing:2px}
#ui .sec{margin-bottom:10px}
#ui label{display:block;margin:2px 0;cursor:pointer;font-size:12px;color:#ddd}
#ui input[type="radio"]{margin-right:6px;accent-color:#4fc3f7}
#ui button{display:block;width:100%;margin:3px 0;padding:8px 10px;background:#1565c0;
  color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;transition:all .2s}
#ui button:hover{background:#1e88e5}
#ui button.on{background:#4fc3f7;color:#000;font-weight:bold}
#info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);
  color:#aaa;padding:7px 16px;border-radius:20px;font-size:11px;z-index:10}
#loadmsg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;
  font-size:18px;z-index:100;background:rgba(0,0,0,0.8);padding:20px 40px;border-radius:10px}
</style>
</head>
<body>
<div id="c"></div>
<div id="loadmsg">正在加载3D场景...</div>
<div id="ui">
  <h2>集控室</h2>
  <div class="sec">
    <b style="font-size:12px;color:#888;">大屏安装方式</b>
    <label><input type="radio" name="st" value="curved" checked> 弧面安装</label>
    <label><input type="radio" name="st" value="flat"> 平面安装</label>
  </div>
  <div class="sec">
    <b style="font-size:12px;color:#888;">视角切换 (快捷键 1-7)</b>
    <button onclick="setView('entrance')" id="b-entrance" class="on">入口视角</button>
    <button onclick="setView('top')" id="b-top">全景俯视</button>
    <button onclick="setView('north')" id="b-north">北侧大屏+坐席</button>
    <button onclick="setView('south')" id="b-south">南侧大屏+坐席</button>
    <button onclick="setView('west')" id="b-west">西侧双屏视角</button>
    <button onclick="setView('corner')" id="b-corner">智慧屏特写</button>
    <button onclick="setView('corridor')" id="b-corridor">过道正视角</button>
  </div>
  <div class="sec">
    <b style="font-size:12px;color:#888;">操作</b>
    <button onclick="captureScreenshot()" style="background:#2e7d32;">导出截图 (PNG)</button>
    <button onclick="toggleWireframe()" style="background:#555;">线框模式</button>
  </div>
</div>
<div id="info">鼠标拖拽旋转 | 滚轮缩放 | 右键平移 | 点击左侧按钮切换视角</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

document.getElementById('loadmsg').style.display = 'none';
initScene();

function initScene() {
// ====================================================================
// SCENE SETUP
// 坐标系: X=0西 X=14东, Z=0北 Z=14南, Y=0地面 Y=3.5天花板
// 房间14m×14m, 中部过道Z=5.5~8.5(宽3m, 东西走向)
// ====================================================================
var container = document.getElementById('c');
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c1c2e);
scene.fog = new THREE.Fog(0x1c1c2e, 30, 70);

var camera = new THREE.PerspectiveCamera(50, container.clientWidth/container.clientHeight, 0.3, 90);
camera.position.set(16, 7, 7);
camera.lookAt(7, 1.5, 7);

var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

var controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(7, 1.5, 7);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 35;
controls.maxPolarAngle = Math.PI*0.55;
controls.update();

// ====================================================================
// LIGHTING
// ====================================================================
scene.add(new THREE.AmbientLight(0x505070, 1.5));

// Ceiling panel lights
for (var x = 1.5; x <= 12.5; x += 3.7) {
  for (var z = 1.5; z <= 12.5; z += 3.7) {
    var ptLight = new THREE.PointLight(0xffeedd, 25, 12, 1.2);
    ptLight.position.set(x, 3.35, z);
    ptLight.castShadow = true;
    ptLight.shadow.mapSize.set(512,512);
    ptLight.shadow.camera.near = 0.1;
    ptLight.shadow.camera.far = 20;
    ptLight.shadow.bias = -0.0001;
    scene.add(ptLight);

    var fixGeo = new THREE.BoxGeometry(1.2, 0.02, 0.3);
    var fixMat = new THREE.MeshStandardMaterial({color:0xfffff0, roughness:0.1, emissive:0xfffff0, emissiveIntensity:0.8});
    var fix = new THREE.Mesh(fixGeo, fixMat);
    fix.position.set(x, 3.48, z);
    scene.add(fix);
  }
}

// ====================================================================
// MATERIALS
// ====================================================================
var M = {
  floor: new THREE.MeshStandardMaterial({color:0x9aacad, roughness:0.35, metalness:0.08}),
  corridor: new THREE.MeshStandardMaterial({color:0xbcc8c8, roughness:0.25, metalness:0.05}),
  wall: new THREE.MeshStandardMaterial({color:0xececec, roughness:0.55, metalness:0.04}),
  ceiling: new THREE.MeshStandardMaterial({color:0xf0ece6, roughness:0.5, metalness:0.05, side: THREE.DoubleSide}),
  frame: new THREE.MeshStandardMaterial({color:0x1a1a1a, roughness:0.2, metalness:0.85}),
  screenSurf: new THREE.MeshStandardMaterial({color:0x03030f, roughness:0.05, metalness:0.4, emissive:0x000022, emissiveIntensity:0.6}),
  glassWall: new THREE.MeshPhysicalMaterial({color:0xccddff, roughness:0.05, metalness:0.05, transparent:true, opacity:0.22}),
  glassWin: new THREE.MeshPhysicalMaterial({color:0xddeeff, roughness:0.03, metalness:0.03, transparent:true, opacity:0.35}),
  steel: new THREE.MeshStandardMaterial({color:0x3a3a3a, roughness:0.25, metalness:0.9}),
  desk: new THREE.MeshStandardMaterial({color:0x2c3e40, roughness:0.35, metalness:0.25}),
  chair: new THREE.MeshStandardMaterial({color:0x1a2528, roughness:0.45, metalness:0.15}),
  ideaHub: new THREE.MeshStandardMaterial({color:0x181818, roughness:0.15, metalness:0.6}),
  ideaHubScr: new THREE.MeshStandardMaterial({color:0x050510, roughness:0.08, metalness:0.3, emissive:0x000018, emissiveIntensity:0.5}),
  sill: new THREE.MeshStandardMaterial({color:0xdddddd, roughness:0.18, metalness:0.5}),
  doorFrame: new THREE.MeshStandardMaterial({color:0x222222, roughness:0.15, metalness:0.9}),
  doorGlass: new THREE.MeshPhysicalMaterial({color:0xffffff, roughness:0.04, metalness:0.08, transparent:true, opacity:0.45}),
  yellowLine: new THREE.MeshStandardMaterial({color:0xffc107, roughness:0.2, emissive:0xffc107, emissiveIntensity:0.25}),
  cornerMark: new THREE.MeshBasicMaterial({color:0x4fc3f7, transparent:true, opacity:0.5})
};

// ====================================================================
// HELPER - creates a box mesh. Optional x,y,z,ry for positioning.
// ====================================================================
function box(w, h, d, mat, x, y, z, ry) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  if (x !== undefined) m.position.set(x, y, z);
  if (ry !== undefined) m.rotation.y = ry;
  return m;
}

// Helper: create, position, optionally rotate-Y, add to parent, return mesh
function addBox(parent, w, h, d, mat, x, y, z, ry) {
  var m = box(w, h, d, mat, x, y, z, ry);
  parent.add(m);
  return m;
}
function addMesh(parent, geo, mat, x, y, z, ry) {
  var m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (ry !== undefined) m.rotation.y = ry;
  parent.add(m);
  return m;
}

// ====================================================================
// FLOOR
// ====================================================================
var fl = new THREE.Mesh(new THREE.PlaneGeometry(14,14), M.floor);
fl.rotation.x = -Math.PI/2; fl.position.set(7,0.005,7); fl.receiveShadow = true;
scene.add(fl);

// Anti-static floor grid lines removed

// 中部过道地面 (Z=5.5~8.5, 宽3m, 东西走向)
var corr = new THREE.Mesh(new THREE.PlaneGeometry(14, 3), M.corridor);
corr.rotation.x = -Math.PI/2; corr.position.set(7, 0.012, 7); corr.receiveShadow = true;
scene.add(corr);
addBox(scene, 14, 0.008, 0.04, M.yellowLine, 7, 0.018, 5.5);
addBox(scene, 14, 0.008, 0.04, M.yellowLine, 7, 0.018, 8.5);

// ====================================================================
// CEILING
// ====================================================================
var ceiling = new THREE.Mesh(new THREE.PlaneGeometry(14,14), M.ceiling);
ceiling.rotation.x = Math.PI/2; ceiling.position.set(7, 3.5, 7);
scene.add(ceiling);

// ====================================================================
// WALLS (坐标系: X=0西 X=14东, Z=0北 Z=14南)
// ====================================================================
// 北墙 Z=0
var nWall = new THREE.Mesh(new THREE.PlaneGeometry(14, 3.5), M.wall);
nWall.position.set(7, 1.75, 0.01); scene.add(nWall);
// 南墙 Z=14 (玻璃幕墙/进户门)
var sWall = new THREE.Mesh(new THREE.PlaneGeometry(14, 3.5), M.wall);
sWall.position.set(7, 1.75, 13.99); sWall.rotation.y = Math.PI; scene.add(sWall);
// 西墙 X=0
var wWall = new THREE.Mesh(new THREE.PlaneGeometry(14, 3.5), M.wall);
wWall.rotation.y = Math.PI/2; wWall.position.set(0.01, 1.75, 7); scene.add(wWall);

// ====================================================================
// WINDOWS (北墙+南墙转角窗户)
// ====================================================================
var winCX = [1.0, 12.5];
function makeWindow(cx, zVal) {
  var g = new THREE.Group();
  var zOut = zVal + (zVal<1?0.03:-0.03); // 窗框向外突出
  var fw = 0.06; // 窗框宽度
  // 窗洞深色背景（模拟玻璃后面的深度）
  var recessMat = new THREE.MeshStandardMaterial({color:0x1a1a22, roughness:0.9});
  addMesh(g, new THREE.PlaneGeometry(1.9, 1.9), recessMat, cx, 1.9, zVal);
  // 玻璃（带蓝色调的半透明）
  var glassMat = new THREE.MeshPhysicalMaterial({color:0xccddff, roughness:0.02, metalness:0.05, transparent:true, opacity:0.25, clearcoat:0.1});
  addMesh(g, new THREE.PlaneGeometry(1.9, 1.9), glassMat, cx, 1.9, zOut);
  // 上横框
  addBox(g, 2+fw*2, fw, 0.1, M.steel, cx, 2.92, zOut);
  // 下横框
  addBox(g, 2+fw*2, fw, 0.1, M.steel, cx, 0.88, zOut);
  // 左竖框
  addBox(g, fw, 2.04, 0.1, M.steel, cx-1, 1.9, zOut);
  // 右竖框
  addBox(g, fw, 2.04, 0.1, M.steel, cx+1, 1.9, zOut);
  // 窗台
  addBox(g, 2.12, 0.03, 0.14, M.sill, cx, 0.86, zOut + (zVal<1?0.04:-0.04));
  return g;
}
winCX.forEach(function(cx) { scene.add(makeWindow(cx, 0.02)); scene.add(makeWindow(cx, 13.98)); });

// ====================================================================
// 南侧玻璃幕墙 (Z=14, 含进户门)
// ====================================================================
function makeSouthGlassWall() {
  var g = new THREE.Group();
  var panels = 7, pw = 14/panels;
  for (var i = 0; i < panels; i++) {
    var gl = new THREE.Mesh(new THREE.PlaneGeometry(pw-0.06, 3.45), M.glassWall);
    gl.position.set(pw/2 + i*pw, 1.75, 14); gl.rotation.y = Math.PI; g.add(gl);
  }
  addBox(g, 14, 0.06, 0.1, M.steel, 7, 3.47, 13.97);
  addBox(g, 14, 0.06, 0.1, M.steel, 7, 0.03, 13.97);
  addBox(g, 14, 0.06, 0.15, M.steel, 7, 0.03, 13.92);
  return g;
}
scene.add(makeSouthGlassWall());

// ====================================================================
// 南侧进户门 (双开玻璃门, 位于南墙 Z≈14 中间位置)
// ====================================================================
var doorGrp = new THREE.Group();
var dw = 1.1, dh = 2.5, dz = 13.92;
var d1 = new THREE.Mesh(new THREE.PlaneGeometry(dw, dh), M.doorGlass);
d1.position.set(7-dw/2, dh/2, dz); d1.rotation.y = Math.PI; doorGrp.add(d1);
var d2 = new THREE.Mesh(new THREE.PlaneGeometry(dw, dh), M.doorGlass);
d2.position.set(7+dw/2, dh/2, dz); d2.rotation.y = Math.PI; doorGrp.add(d2);
var ff = 0.05;
addBox(doorGrp, 2*dw+ff*2, ff, 0.1, M.doorFrame, 7, dh, dz);
addBox(doorGrp, ff, dh, 0.1, M.doorFrame, 7-dw-ff/2, dh/2, dz);
addBox(doorGrp, ff, dh, 0.1, M.doorFrame, 7+dw+ff/2, dh/2, dz);
addBox(doorGrp, ff, dh, 0.1, M.doorFrame, 7, dh/2, dz);
var hGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.35, 8);
var hMat = new THREE.MeshStandardMaterial({color:0xcccccc, roughness:0.08, metalness:0.95});
addMesh(doorGrp, hGeo, hMat, 7-dw+0.15, 1.15, dz-0.04);
addMesh(doorGrp, hGeo, hMat, 7+dw-0.15, 1.15, dz-0.04);
scene.add(doorGrp);

// ====================================================================
// LOAD SCREEN TEXTURES FROM IMAGE FILES
// ====================================================================
var loader = new THREE.TextureLoader();
var texLarge = loader.load(encodeURI('大.png'));
var texSmall = loader.load(encodeURI('小.jpg'));
var texFlat = loader.load(encodeURI('大平.jpg'));
texLarge.colorSpace = THREE.SRGBColorSpace;
texSmall.colorSpace = THREE.SRGBColorSpace;
texFlat.colorSpace = THREE.SRGBColorSpace;
// Curved mode materials (self-illuminated,不受灯光影响)
var scrThermalMat = new THREE.MeshBasicMaterial({map: texLarge});
var scrWindMat = new THREE.MeshBasicMaterial({map: texLarge});
var scrVideoMat = new THREE.MeshBasicMaterial({map: texSmall});
// Flat mode materials
var scrFlatLarge = new THREE.MeshBasicMaterial({map: texFlat});
var scrFlatSmall = new THREE.MeshBasicMaterial({map: texSmall});
// ====================================================================
// 北屏(nScreenGrp), 南屏(sScreenGrp), 西屏(wnScreenGrp/wsScreenGrp)
var nScreenGrp = new THREE.Group(); var sScreenGrp = new THREE.Group();
var wnScreenGrp = new THREE.Group(); var wsScreenGrp = new THREE.Group();
scene.add(nScreenGrp); scene.add(sScreenGrp);
scene.add(wnScreenGrp); scene.add(wsScreenGrp);

// ====================================================================
// FLAT SCREEN
// ====================================================================
function createFlatScreen(w, h, bY, scrMat) {
  var g = new THREE.Group();
  var depth = 0.5; // 50cm 屏体厚度

  // Screen back body
  addBox(g, w, h, depth, M.frame, 0, bY+h/2, -depth/2);

  // Side panels to show depth clearly
  addBox(g, 0.03, h, depth, M.steel, -w/2-0.015, bY+h/2, -depth/2);
  addBox(g, 0.03, h, depth, M.steel, w/2+0.015, bY+h/2, -depth/2);

  // Top and bottom depth panels
  addBox(g, w+0.06, 0.03, depth, M.steel, 0, bY+h+0.015, -depth/2);
  addBox(g, w+0.06, 0.03, depth, M.steel, 0, bY-0.015, -depth/2);

  // Screen surface with content
  var surfGeo = new THREE.PlaneGeometry(w, h);
  var surf = new THREE.Mesh(surfGeo, scrMat || M.screenSurf);
  surf.position.set(0, bY+h/2, 0.005);
  g.add(surf);

  // Frame (thin bezel)
  var fw = 0.04;
  addBox(g, w+fw*2, fw, 0.06, M.frame, 0, bY+h, 0.03);
  addBox(g, w+fw*2, fw, 0.06, M.frame, 0, bY, 0.03);
  addBox(g, fw, h, 0.06, M.frame, -w/2, bY+h/2, 0.03);
  addBox(g, fw, h, 0.06, M.frame, w/2, bY+h/2, 0.03);
  return g;
}

// ====================================================================
// CURVED SCREEN
// ====================================================================
function createCurvedScreen(w, h, bY, R, scrMat) {
  var g = new THREE.Group();
  var segs = 80;
  var halfA = w/(2*R);
  var segMat = new THREE.MeshBasicMaterial({color:0x03030f});
  var depth = 0.5; // 50cm

  // Screen segments with depth
  for (var i = 0; i < segs; i++) {
    var a1 = -halfA + i*(2*halfA/segs), a2 = a1 + (2*halfA/segs), midA = (a1+a2)/2;
    var segW = R * (Math.sin(a2) - Math.sin(a1));
    // Back body
    var backBox = box(Math.abs(segW), h, depth, M.frame);
    backBox.position.set(R*Math.sin(midA), bY+h/2, R*(1-Math.cos(midA))-depth/2);
    backBox.rotation.y = -midA;
    g.add(backBox);
    // Front surface with content (adjust UVs to span texture across all segments)
    var surfGeo = new THREE.PlaneGeometry(Math.abs(segW), h);
    var uvs = surfGeo.attributes.uv;
    for (var vi = 0; vi < uvs.count; vi++) {
      uvs.setXY(vi, uvs.getX(vi) / segs + i / segs, uvs.getY(vi));
    }
    var surf = new THREE.Mesh(surfGeo, scrMat || segMat);
    surf.position.set(R*Math.sin(midA), bY+h/2, R*(1-Math.cos(midA))+0.005);
    surf.rotation.y = -midA;
    g.add(surf);
  }

  // Frame (bezel)
  var fH = 0.04;
  for (var j2 = 0; j2 < segs; j2++) {
    var aa1 = -halfA + j2*(2*halfA/segs), aa2 = aa1 + (2*halfA/segs), ma = (aa1+aa2)/2;
    var segLen = R * (aa2 - aa1);
    addBox(g, segLen, fH, depth+0.02, M.frame, R*Math.sin(ma), bY, R*(1-Math.cos(ma))-depth/2, -ma);
    addBox(g, segLen, fH, depth+0.02, M.frame, R*Math.sin(ma), bY+h, R*(1-Math.cos(ma))-depth/2, -ma);
  }
  for (var sgn = 0; sgn < 2; sgn++) {
    var endA = (sgn===0?-1:1) * halfA;
    for (var k = 0; k < 20; k++) {
      var fy = bY + (k+0.5)*h/20;
      addBox(g, 0.04, h/20, depth+0.02, M.frame, R*Math.sin(endA), fy, R*(1-Math.cos(endA))-depth/2, -endA);
    }
  }
  return g;
}

var scrType = 'curved';
function buildAllScreens(type) {
  [nScreenGrp, sScreenGrp, wnScreenGrp, wsScreenGrp].forEach(function(grp) {
    while(grp.children.length > 0) grp.remove(grp.children[0]);
  });
  var SW=10.8, SH=2.025, bY=0.895, bYw=0.7, WSW=4.2, cR=100;

  // Helper: create cabinet below screen (50cm depth, metallic)
  function addCabinet(parent, w, h, x, z, ry) {
    var cabMat = new THREE.MeshStandardMaterial({color:0x9a9aa5, roughness:0.2, metalness:0.85});
    var trimMat = new THREE.MeshStandardMaterial({color:0xb0b0b8, roughness:0.12, metalness:0.9});
    // Main cabinet body (0.5m depth, same as screen)
    var cab = box(w, h, 0.5, cabMat);
    cab.position.set(x, h/2, z); if (ry) cab.rotation.y = ry;
    parent.add(cab);
    // Top trim
    var trim = box(w+0.02, 0.02, 0.5, trimMat);
    trim.position.set(x, h, z); if (ry) trim.rotation.y = ry;
    parent.add(trim);
    // Bottom trim
    var btrim = box(w+0.02, 0.02, 0.5, trimMat);
    btrim.position.set(x, 0.02, z); if (ry) btrim.rotation.y = ry;
    parent.add(btrim);
  }

  if (type==='curved') {
    var ns=createCurvedScreen(SW,SH,bY,cR,scrThermalMat); ns.position.set(8.2,0,0.5); nScreenGrp.add(ns);
    addCabinet(nScreenGrp, SW, bY, 8.2, 0.3, 0); // 北屏下方柜子
    var ss=createCurvedScreen(SW,SH,bY,cR,scrWindMat); ss.position.set(8.2,0,13.5); ss.rotation.y=Math.PI; sScreenGrp.add(ss);
    addCabinet(sScreenGrp, SW, bY, 8.2, 13.7, Math.PI); // 南屏下方柜子
    var wns=createCurvedScreen(WSW,SH,bYw,cR,scrVideoMat); wns.position.set(0.06,0,3.8); wns.rotation.y=Math.PI/2; wnScreenGrp.add(wns);
    var wss=createCurvedScreen(WSW,SH,bYw,cR,scrVideoMat); wss.position.set(0.06,0,10.2); wss.rotation.y=Math.PI/2; wsScreenGrp.add(wss);
  } else {
    var fns=createFlatScreen(SW,SH,bY,scrFlatLarge); fns.position.set(8.2,0,0.5); nScreenGrp.add(fns);
    addCabinet(nScreenGrp, SW, bY, 8.2, 0.3, 0);
    var fss=createFlatScreen(SW,SH,bY,scrFlatLarge); fss.position.set(8.2,0,13.5); fss.rotation.y=Math.PI; sScreenGrp.add(fss);
    addCabinet(sScreenGrp, SW, bY, 8.2, 13.7, Math.PI);

// ====================================================================
// DIRECTION LABELS (方位标注)
// 坐标系: X=0西 X=14东, Z=0北 Z=14南
// ====================================================================
function makeDirLabel(text, x, z, rotZ) {
  var canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath(); ctx.arc(128, 128, 110, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = 'bold 100px "Microsoft YaHei","SimHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 128);
  ctx.fillStyle = 'rgba(79,195,247,0.9)';
  ctx.beginPath();
  ctx.moveTo(128, 200); ctx.lineTo(98, 140); ctx.lineTo(158, 140);
  ctx.fill();

  var tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  var geo = new THREE.PlaneGeometry(2.0, 2.0);
  var mat = new THREE.MeshBasicMaterial({map: tex, transparent: true, depthTest: false, side: THREE.DoubleSide});
  var mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI/2;
  mesh.position.set(x, 0.04, z);
  mesh.rotation.z = rotZ || 0;
  return mesh;
}

window.setView = function(name) {
  var v = views[name];
  if (!v) return;

  // Toggle ceiling & duct: hide for top view, show for all others
  ceiling.visible = !v.hideDuct;
  ductGroup.visible = !v.hideDuct;

  var sP = camera.position.clone();
  var sT = controls.target.clone();
  var eP = new THREE.Vector3(v.pos[0], v.pos[1], v.pos[2]);
  var eT = new THREE.Vector3(v.tgt[0], v.tgt[1], v.tgt[2]);
  var dur = 1200, t0 = performance.now();

  function anim(now) {
    var t = Math.min((now-t0)/dur, 1);
    var ease = t<0.5 ? 2*t*t : -1+(4-2*t)*t;
    camera.position.lerpVectors(sP, eP, ease);
    controls.target.lerpVectors(sT, eT, ease);
    controls.update();
    if (t<1) requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);

  document.querySelectorAll('#ui button').forEach(function(b){b.classList.remove('on')});
  var btn = document.getElementById('b-'+name);
  if (btn) btn.classList.add('on');
};

  wireframeMode = !wireframeMode;

    if (child.isMesh && child.material) {
      if (Array.isArray(child.material)) {
        child.material.forEach(function(m) { if (m.wireframe !== undefined) m.wireframe = wireframeMode; });

  });
};

  camera.aspect = container.clientWidth/container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// Keyboard
window.addEventListener('keydown', function(e) {
  var map = {'1':'entrance','2':'top','3':'north','4':'south','5':'west','6':'corner','7':'corridor'};
  if (map[e.key]) setView(map[e.key]);
});

// Auto start
setTimeout(function() { setView('entrance'); }, 600);
